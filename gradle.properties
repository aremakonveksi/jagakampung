# Project-wide Gradle settings.
# Catatan: laptop ini punya RAM 8 GB (sisa sering < 1 GB). Heap 2048m terbukti
# membuat Gradle daemon dibunuh OS ("daemon disappeared unexpectedly").
# Heap diturunkan + parallel dimatikan supaya build stabil.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache=false
